# CS Bull Trend / 默认多头趋势（饰品）

name: bull_trend
display_name: 默认多头趋势
description: CS 单品分析默认策略；多头结构下覆盖趋势确认、缩量回踩与放量突破等买入分支。
category: trend
core_rules: [1, 2, 3, 4]
aliases: [趋势, 趋势分析, 多头趋势, 缩量回踩, 放量突破, 回踩, 突破]
default_active: true
default_router: true
default_priority: 10
market_regimes: [trending_up]

instructions: |
  **CS 默认多头趋势**

  适用：常规饰品分析默认策略；优先寻找「趋势向上 + 风险可控 + 不追高」。

  1. **趋势确认**（`trend`）
     - MA5 ≥ MA10 ≥ MA20 且 MA20 斜率向上 → 多头结构；短均线上穿长均线视为趋势启动/延续信号，无需单独「金叉」策略。
     - 价格显著跌破 MA20 → 降低看多权重。

  2. **位置与节奏**
     - 优先「回踩不破」而非「高位追涨」。
     - 距 MA5/MA10 乖离过大（`bias_ma5`）→ 提示等待回踩。
     - 无清晰优势时写「暂不出手」。

  3. **买入条件分支**（在多头前提下择一或组合判断）

     **A. 缩量回踩**（`recent_daily_bars` + `trend`）
     - 价格回踩 MA5（约 1% 误差）或 MA10（约 2% 误差），且回调期 `volume` 低于近 5 日均量约 70%。
     - 现价守住均线支撑，MA5 乖离 < 2% 为较佳区间；止损参考 MA20。
     - 可选 `event_intel`：无重大利空或供给冲击（新箱、大规模放货等）。

     **B. 放量突破**（`volume_ratio_5d` + `recent_daily_bars` + `trend.resistance_levels`）
     - 阻力位通常为 20 日高点或前期震荡平台顶部。
     - 突破日 `volume` 明显高于近 5 日均量（约 >2 倍）；收盘价站上阻力位。
     - 突破后乖离仍宜 < 5%；次日仍守在突破位之上 → 真突破概率更高，快速跌回箱内 → 假突破。
     - 止损设在突破位下方约 3%。

  4. **量价验证**（通用）
     - `volume` 为日成交笔数，不用 `sell_num` 代替。
     - 缩量上涨需谨慎，放量滞涨需警惕分歧。

  5. **输出**
     - 明确买入/观望/减仓倾向与触发条件（标注属于回踩还是突破分支）。
     - 止损参考 MA20 下方或结构低点；`data_quality` 非 full 时说明不确定性。
