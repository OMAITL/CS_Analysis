# CS Platform Arbitrage / 跨平台价差

name: platform_arbitrage
display_name: 跨平台价差
description: 基于 BUFF、悠悠有品、Steam 等多平台挂牌价，评估套利空间与执行风险。
category: cs_native
core_rules: [1, 3, 5]
aliases: [跨平台套利, 平台价差, BUFF悠悠价差, 搬砖]

instructions: |
  **CS 跨平台价差策略**（饰品市场独有，非股票语义）

  数据：`snapshot` 中各平台 `*_sell_price`、`*_sell_num`（挂牌量，≠成交量）。

  1. **价差计算**
     - 找出最低卖价平台与最高卖价平台；价差率 = (高-低)/低。
     - 价差 < 3%：套利空间有限；3%~8%：需扣手续费后评估；>8%：重点说明但警惕异常低价陷阱。

  2. **可执行性**
     - 低价端 `sell_num` 过低 → 流动性不足，标注「理论价差、难成交」。
     - Steam 侧需考虑余额周期、手续费与汇率；国内平台注意提现/到账规则（定性描述，不写死费率）。

  3. **与趋势结合**（`trend`）
     - 价差扩大同时价格突破 → 可能是资金抢筹或搬砖活跃；价差收敛且价格滞涨 → 套利窗口关闭。

  4. **输出**
     - 推荐参考平台、价差结论、主要风险（假单、磨损档不一致、冷却期）。
     - 禁止用「板块联动」「涨停」等股票用语。
