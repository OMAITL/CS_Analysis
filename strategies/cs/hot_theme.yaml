# CS Hot Theme / 热点题材（饰品）

name: hot_theme
display_name: 热点题材
description: 跟踪 Major、贴纸、新箱与市场热议，判断题材热度与是否蹭热点。
category: framework
core_rules: [2, 3, 5, 7]
aliases: [热点, 题材, 热点题材]

instructions: |
  **CS 热点题材策略**

  1. **热点强度**（`event_intel`）
     - Major、贴纸、新箱、官方更新、贴吧/市场讨论是否集中出现。
     - 仅单品暴涨而无同类/赛事/箱子共振 → 降权。

  2. **本品相关性**
     - 区分：直接受益（本品/同系列/同箱） vs 情绪跟风。
     - 概念弱但涨幅大 → 提示兑现风险。

  3. **相对表现**（`trend` + 可选 `index_summary`）
     - 量比、RSI、涨幅是否强于饰品指数或近期平台价趋势。

  4. **节奏**
     - 连续加速、乖离 MA5 过大时不追；情报显示「已大涨/过热」时保守。
