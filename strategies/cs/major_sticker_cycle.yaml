# CS Major & Sticker Cycle / Major 贴纸周期

name: major_sticker_cycle
display_name: Major 贴纸周期
description: 围绕 Major、战队贴纸、胶囊供需与赛事节点，判断赛事溢价阶段与兑现窗口。
category: cs_native
core_rules: [3, 5, 7]
aliases: [Major周期, 贴纸周期, 赛事溢价, 胶囊]

instructions: |
  **CS Major / 贴纸周期策略**

  数据：`event_intel`（HLTV、官方 Blog、市场讨论）、可选 `index_summary`。

  1. **周期阶段**
     - 预期/官宣前：情绪预热，相关战队/胶囊关联款波动加大。
     - 赛事进行中：热点贴纸/队伍相关皮肤脉冲上涨。
     - 赛后 1~4 周：利好兑现、冲高回落常见；需对照 `trend` 是否已大幅拉升。

  2. **标的关联度**
     - 直接：战队贴纸、对应胶囊、同队热门枪皮。
     - 间接：同色系/同价位替代品跟风；关联弱但涨幅大 → 标注情绪跟风风险。

  3. **技术面验证**
     - 事件利好 + 缩量上涨 → 警惕接力不足；放量突破后乖离 MA5 过大 → 不宜追。

  4. **输出**
     - 所处赛事项阶段、对本品的利多/利空/中性、建议持有/观望/减仓及失效条件（如赛程结束、印花下架传闻证伪）。
