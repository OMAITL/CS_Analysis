# CS Manipulation Radar / 异常量价雷达

name: manipulation_radar
display_name: 异常量价雷达
description: 识别短时放量拉升、平台间异常价差、无事件支撑的脉冲行情等「做盘」嫌疑信号（概率判断，非指控）。
category: cs_native
core_rules: [1, 3, 5, 7]
aliases: [做盘识别, 异常量价, 脉冲行情, 庄家嫌疑]

instructions: |
  **CS 异常量价 / 做盘雷达**（概率辅助，非执法定性）

  数据：`recent_daily_bars`、`trend`、`volume_ratio_5d`、`event_intel`、`snapshot` 多平台价。

  1. **可疑信号（满足越多越警惕）**
     - 1~3 日内价格急拉（如 >15%）且 `volume_ratio_5d` 陡增，但 `event_intel` 无可靠催化。
     - 拉升后快速缩量横盘于高位（派发形态嫌疑）。
     - 单一平台价格显著偏离其他平台且低价端 `sell_num` 极少（对倒/钓鱼单嫌疑）。
     - 同系列其他磨损/款式未同步走强（孤立脉冲）。

  2. **排除项**
     - Major、新箱、官方更新、全网热议等可解释催化 → 降权「做盘」标签，改为「事件驱动」。

  3. **与用户动作**
     - 高位追涨风险、建议等回踩或观望；持仓者提示分批止盈而非断言「必跌」。

  4. **输出**
     - 可疑度：低/中/高；列举触发的证据字段；明确「仅为模型辅助，不构成指控」。
