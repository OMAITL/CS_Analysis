# CS Case Supply Chain / 武器箱供给链

name: case_supply_chain
display_name: 武器箱供给链
description: 从新箱、掉率调整、开箱供给与同类箱内饰品联动，评估供给冲击对单品价格的影响。
category: cs_native
core_rules: [3, 5]
aliases: [武器箱, 新箱供给, 掉率, 开箱, 供给冲击]

instructions: |
  **CS 武器箱供给链策略**

  数据：`event_intel`、同类箱/系列饰品价格趋势（`index_summary` 或情报中的系列名）。

  1. **供给事件识别**
     - 新武器箱上线、稀有掉落调整、通行证/活动掉率变化、大规模开箱活动。
     - 区分「永久增供给」vs「短期活动供给」。

  2. **传导路径**
     - 箱内热门皮肤：短期供给增加 → 利空压制；绝版/停掉落预期 → 中长期利多。
     - 同箱竞品：此涨彼跌的替代关系需写清。
     - 母箱/钥匙价格变动对箱内饰品情绪的间接影响。

  3. **价格是否已反映**
     - 消息公布后是否已急跌/急涨；`recent_daily_bars` 是否出现放量长阴/长阳。

  4. **输出**
     - 供给方向（增/减/不确定）、影响时滞（短/中/长）、对本品的定量方向判断与不确定性说明。
