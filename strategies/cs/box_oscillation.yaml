# CS Box Oscillation / 箱体震荡（饰品）

name: box_oscillation
display_name: 箱体震荡
description: 识别价格箱体区间，箱底介入、箱顶减仓，适用于横盘震荡行情。
category: framework
core_rules: [1, 2, 3]
aliases: [箱体, 箱体震荡]
default_priority: 50
market_regimes: [sideways]

instructions: |
  **CS 箱体震荡**

  1. **箱体识别**（`recent_daily_bars` 近 60~120 日 + `trend` 支撑/阻力）
     - 箱顶：多次触碰未有效突破的高点聚集区。
     - 箱底：多次下探未有效跌破的低点聚集区。
     - 顶底各至少 2~3 次触碰方可确认。

  2. **当前位置**（现价 vs 箱界）
     - 箱底（距支撑 ≤5%）：介入/加仓，止损箱底下方约 3%。
     - 箱中：观望。
     - 箱顶（距阻力 ≤5%）：减仓/止盈，不追高。

  3. **量能辅助**（`volume` / `volume_ratio_5d`）
     - 箱底放量企稳 → 支撑有效；箱顶缩量滞涨 → 阻力有效。
     - 放量突破均量约 2 倍以上：向上有效突破转趋势策略；向下跌破则离场。

  4. **箱体宽度**
     - 宽度 < 5%：空间过小；5%~15%：标准波段；> 15%：大箱体。

  5. **假突破**
     - 单日刺破后收回箱内 → 假突破；连续两日收盘突破且放量 → 真突破。

  输出：箱顶/箱底价位、当前区间、突破方向与止损；忽略板块、涨停等股票用语。
