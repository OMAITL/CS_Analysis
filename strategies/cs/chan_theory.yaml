# CS Chan Theory / 缠论（饰品）

name: chan_theory
display_name: 缠论
description: 基于日 K 分型、笔、中枢与 MACD 背驰分析 CS 饰品（无涨停/筹码语义）。
category: framework
core_rules: [1, 2, 3, 4]
aliases: [缠论, 缠论分析]

instructions: |
  **CS 缠论策略**

  使用 `recent_daily_bars`（建议 ≥60 日）与 `trend` 中 MACD：

  1. 识别震荡中枢 vs 趋势段；饰品波动更大，中枢边界宜放宽。
  2. 顶/底背驰：价格新高/新低与 MACD 柱面积对比（`macd_dif/dea`、`macd_status`）。
  3. 买卖点描述用「观望/轻仓/减仓」，不用涨停、封板、龙虎榜等股票用语。
  4. 流动性低于股票时，背驰信号需结合 `volume` 与 `data_quality` 降级表述。
