# CS Event Driven / 事件驱动（饰品）

name: event_driven
display_name: 事件驱动
description: 围绕 Major、新箱、官方更新、HLTV/市场新闻等 CS 事件，评估催化与兑现风险。
category: framework
core_rules: [3, 5]
aliases: [事件驱动, 催化, 催化事件]

instructions: |
  **CS 事件驱动策略**

  适用：Major/贴纸、武器箱更新、官方 Blog、HLTV、饰品市场热议等。

  1. **事件分类**（仅用 `event_intel` 与事件情报正文）
     - 赛事/Major、贴纸、新箱/掉率、版本更新、市场政策、社区舆情。
     - 无明确时间或已过时的信息降权。

  2. **影响路径**
     - 说明影响的是供给、流动性、情绪溢价还是短期炒作。
     - 武器箱/同类饰品间接影响需写明传导链。

  3. **与技术面结合**（`trend` + `recent_daily_bars`）
     - 利好后是否已大幅拉升、是否接近阻力、是否放量滞涨。

  4. **输出**
     - 事件性质：利好/利空/中性/不确定；是否已反映在价格中；失效条件。
