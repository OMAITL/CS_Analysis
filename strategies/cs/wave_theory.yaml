instructions: |
  **CS 波浪理论策略**

  使用 `recent_daily_bars`（建议 ≥120 日）：

  1. 尝试标注当前处于推动浪还是调整浪；**允许不确定**，勿强行数浪。
  2. 饰品周期通常短于股票，子浪划分宜更保守，避免过度拟合。
  3. 结合 `trend.ma_alignment`、`macd_status` 验证方向。
  4. 报告用中文简述浪型假设与失效位（如跌破最近 swing low），勿引用涨停/板块概念。
